[package]
name = "teammate-desktop"
version = "0.1.0"
description = "Local-first workspace for human and AI teammates"
authors = ["Teammate contributors"]
edition = "2021"

[lib]
name = "teammate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.3.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2.3.5"
