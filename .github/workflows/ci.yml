name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm --filter @teammate/web exec tsc --noEmit
          pnpm desktop:check

      - name: Core tests
        run: |
          pnpm --filter @teammate/execution-core test
          pnpm --filter @teammate/local-server test
          pnpm --filter @teammate/runtime test

      - name: Build
        run: pnpm build
        env:
          # The Next.js build reads these at compile time. CI uses placeholders
          # since we're only checking that the build succeeds — no actual data
          # access happens. Self-hosters set their real values in their deploy env.
          NEXT_PUBLIC_TEAMMATE_LOCAL_MODE: "true"
          NEXT_PUBLIC_TEAMMATE_LOCAL_SERVER_URL: http://127.0.0.1:8787
