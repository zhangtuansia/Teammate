name: Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            os: macos-15
          - platform: macOS-x64
            os: macos-15-intel
          - platform: Windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Read pinned Bun version
        id: bun-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Bun (Windows baseline)
        if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun-version.outputs.version }}/bun-windows-x64-baseline.zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm desktop:build

      # Pull-request artifacts are for installation testing only. A public release
      # must use the platform signing/notarization secrets in a dedicated workflow.
      - name: Upload unsigned CI installers
        uses: actions/upload-artifact@v4
        with:
          name: teammate-${{ matrix.platform }}-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
